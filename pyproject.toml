[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-to-theorize"
version = "0.1.0"
description = "Official PyTorch implementation of Learning to Theorize the World from Observation"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
  {name = "Doojin Baek"},
  {name = "Gyubin Lee"},
  {name = "Junyeob Baek"},
  {name = "Hosung Lee"},
  {name = "Sungjin Ahn"},
]
dependencies = [
  "h5py>=3.14,<4",
  "numpy>=2.0,<3",
]

[project.optional-dependencies]
train = ["torch>=2.7,<3", "wandb>=0.20,<1"]
arithmetic = ["torch>=2.7,<3", "omegaconf>=2.3,<3", "lightning>=2.5,<3", "tqdm>=4.67,<5"]
test = ["pytest>=8,<10"]
# Image Editing primitives are defined through torchvision/Pillow.
image-editing = ["torch>=2.7,<3", "torchvision>=0.22,<1", "pillow>=10,<12"]

[tool.setuptools]
license-files = ["LICENSE", "LICENSES/Apache-2.0.txt"]

[tool.setuptools.packages.find]
where = ["src"]
